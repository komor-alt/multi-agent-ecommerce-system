# CI for Agentic Commerce Platform
#
# Three independent jobs: Java (after-sales trust boundary + offline agent
# evaluation), Gateway (NestJS), and Frontend (React). All tests are offline:
# no external API is called, no LLM key is configured or required. The Java
# suite runs the after-sales agent loop in RULES mode / with injected model
# stand-ins and fails if any safety gate (unauthorized action, model-supplied
# amount, model-supplied tool arguments) is breached.
#
# The Python job covers only the pinned tau3 adapter, not the legacy service.
# No job receives model secrets or runs a paid benchmark.

name: Offline CI

on:
  push:
    branches:
      - main
      - feature/agent-platform-workbench
      - codex/luna-recommendation-platform
      - codex/tau-bench-retail-eval
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  ECOM_EMBEDDING_LIVE_ENABLED: 'false'
  ECOM_EMBEDDING_MAX_CALLS: '0'

jobs:
  java:
    name: Java (after-sales + eval)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Java tests (includes offline after-sales eval)
        working-directory: java
        run: mvn -B test

      - name: Upload after-sales eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-sales-eval-reports
          path: |
            java/target/after-sales-eval/
            java/target/surefire-reports/
          if-no-files-found: warn

  gateway:
    name: Gateway (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Authentication and authorization contracts
        working-directory: backend
        run: npm run test:auth

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  tau3-adapter:
    name: tau3 adapter (offline, no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: benchmarks/tau3-retail
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
          cache-dependency-glob: benchmarks/tau3-retail/uv.lock
      - name: Install locked Python 3.12 environment and official data
        run: bash scripts/setup_tau3.sh
      - name: Test adapter contracts (offline only)
        env:
          TAU2_DATA_DIR: ${{ github.workspace }}/benchmarks/tau3-retail/env/tau2-bench/data
        run: uv run --frozen pytest -m 'not live' --junitxml=offline-tests.xml
      - name: Upload adapter test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau3-adapter-offline-tests
          path: benchmarks/tau3-retail/offline-tests.xml
          if-no-files-found: warn
