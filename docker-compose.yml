services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent-service:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ECOM_LLM_API_KEY: ${ECOM_LLM_API_KEY:-your_api_key_here}
      ECOM_LLM_BASE_URL: ${ECOM_LLM_BASE_URL:-https://api.deepseek.com}
      ECOM_LLM_MODEL: ${ECOM_LLM_MODEL:-deepseek-v4-flash}
      ECOM_REDIS_URL: redis://redis:6379/0
      ECOM_DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@postgres:5432/ecommerce_agent
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  java-agent-service:
    build:
      context: ./java
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_agent
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_PLATFORM: postgresql
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema-postgresql.sql
      ECOM_LLM_API_KEY: ${ECOM_LLM_API_KEY:-your_api_key_here}
      ECOM_LLM_BASE_URL: ${ECOM_LLM_BASE_URL:-https://api.deepseek.com}
      ECOM_LLM_MODEL: ${ECOM_LLM_MODEL:-deepseek-v4-flash}
      ECOM_RECOMMEND_MODE: ${ECOM_RECOMMEND_MODE:-RULES}
      ECOM_RECOMMEND_LIVE_ENABLED: ${ECOM_RECOMMEND_LIVE_ENABLED:-false}
      ECOM_RECOMMEND_MAX_LLM_CALLS: ${ECOM_RECOMMEND_MAX_LLM_CALLS:-0}
      ECOM_SUPERVISOR_MAX_LLM_CALLS: ${ECOM_SUPERVISOR_MAX_LLM_CALLS:-0}
      ECOM_AGENT_OUTBOX_TRANSPORT: ${ECOM_AGENT_OUTBOX_TRANSPORT:-local}
      ECOM_AGENT_OUTBOX_SCAN_MS: ${ECOM_AGENT_OUTBOX_SCAN_MS:-250}
      ECOM_AGENT_OUTBOX_BATCH_SIZE: ${ECOM_AGENT_OUTBOX_BATCH_SIZE:-200}
      ECOM_AGENT_OUTBOX_MAX_ATTEMPTS: ${ECOM_AGENT_OUTBOX_MAX_ATTEMPTS:-10}
      ECOM_AGENT_OUTBOX_RETRY_DELAY_MS: ${ECOM_AGENT_OUTBOX_RETRY_DELAY_MS:-5000}
      ECOM_AGENT_OUTBOX_LEASE_MS: ${ECOM_AGENT_OUTBOX_LEASE_MS:-60000}
      ECOM_INTERNAL_API_AUTH_ENABLED: ${ECOM_INTERNAL_API_AUTH_ENABLED:-false}
      JAVA_INTERNAL_SERVICE_TOKEN: ${JAVA_INTERNAL_SERVICE_TOKEN:-}
      ECOM_AGENT_RUN_TIMEOUT: ${ECOM_AGENT_RUN_TIMEOUT:-60s}
      ECOM_AGENT_RECOVERY_ENABLED: ${ECOM_AGENT_RECOVERY_ENABLED:-true}
      ECOM_AGENT_RECOVERY_LEASE_DURATION: ${ECOM_AGENT_RECOVERY_LEASE_DURATION:-30s}
      ECOM_AGENT_RECOVERY_HEARTBEAT_INTERVAL: ${ECOM_AGENT_RECOVERY_HEARTBEAT_INTERVAL:-5s}
      ECOM_AGENT_RECOVERY_RENEWAL_TIMEOUT_SECONDS: ${ECOM_AGENT_RECOVERY_RENEWAL_TIMEOUT_SECONDS:-3}
      ECOM_AGENT_RECOVERY_SCAN_INTERVAL: ${ECOM_AGENT_RECOVERY_SCAN_INTERVAL:-1s}
      ECOM_AGENT_RECOVERY_BATCH_SIZE: ${ECOM_AGENT_RECOVERY_BATCH_SIZE:-16}
      ECOM_AGENT_RECOVERY_MAX_ATTEMPTS: ${ECOM_AGENT_RECOVERY_MAX_ATTEMPTS:-3}
      ECOM_AGENT_RECOVERY_HEARTBEAT_THREADS: ${ECOM_AGENT_RECOVERY_HEARTBEAT_THREADS:-1}
      ECOM_AGENT_RECOVERY_HEARTBEAT_SHUTDOWN_SECONDS: ${ECOM_AGENT_RECOVERY_HEARTBEAT_SHUTDOWN_SECONDS:-5}
      ECOM_OUTBOUND_CONNECT_TIMEOUT: ${ECOM_OUTBOUND_CONNECT_TIMEOUT:-3s}
      ECOM_OUTBOUND_READ_TIMEOUT: ${ECOM_OUTBOUND_READ_TIMEOUT:-15s}
      ECOM_DB_MAX_POOL_SIZE: ${ECOM_DB_MAX_POOL_SIZE:-20}
      ECOM_DB_MIN_IDLE: ${ECOM_DB_MIN_IDLE:-4}
      ECOM_EMBEDDING_PROVIDER: "${ECOM_EMBEDDING_PROVIDER:-qwen}"
      ECOM_EMBEDDING_BASE_URL: "${ECOM_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}"
      ECOM_EMBEDDING_API_KEY: "${ECOM_EMBEDDING_API_KEY:-}"
      ECOM_EMBEDDING_MODEL: "${ECOM_EMBEDDING_MODEL:-text-embedding-v4}"
      ECOM_EMBEDDING_DIMENSIONS: "${ECOM_EMBEDDING_DIMENSIONS:-1024}"
      ECOM_EMBEDDING_LIVE_ENABLED: "${ECOM_EMBEDDING_LIVE_ENABLED:-false}"
      ECOM_EMBEDDING_MAX_CALLS: "${ECOM_EMBEDDING_MAX_CALLS:-0}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce_agent?schema=public
      LEGACY_PYTHON_AGENT_SERVICE_BASE_URL: http://agent-service:8000
      JAVA_AGENT_SERVICE_BASE_URL: http://java-agent-service:8080
      # This compose file is a loopback-only developer environment, not production deployment.
      NODE_ENV: ${ECOM_NODE_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ACCOUNTS_JSON: ${AUTH_ACCOUNTS_JSON:-[]}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_INTERNAL_SERVICE_TOKEN: ${JAVA_INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      java-agent-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_ASSET_BASE: "/"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
